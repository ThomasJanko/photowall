services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* : lues depuis .env au moment du BUILD (obligatoire)
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        TARGET_DATE: ${TARGET_DATE:-}
    ports:
      - "${PORT:-3000}:3000"
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      # Persistance : photos.json + fichiers uploadés survivent aux rebuilds
      - app-data:/app/data
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVER_PORT: ${SERVER_PORT:-4000}
      ADMIN_CODE: ${ADMIN_CODE:-change-moi}
    restart: unless-stopped
    healthcheck:
      # Next (site) + Express (API) doivent répondre
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -fsS http://127.0.0.1:3000/ >/dev/null && curl -fsS http://127.0.0.1:4000/health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  app-data:
